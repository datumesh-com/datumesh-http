name: test

on:
  push:
  pull_request:
  workflow_call: # release.yml runs this workflow before publishing

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.97", "1.99"] # MSRV and stable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup default ${{ matrix.toolchain }}
      - run: cargo test --locked
      # The brief's timings (batch, slice, load, rate limits) hold for an optimised build.
      - run: cargo test --release --locked
      # Request binding through the client libraries: Python datumesh 0.4.1, JS @datumesh/verify 0.4.1.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: tools/client_check.sh --native target-out/binding-cases.jsonl

  # A cache (nginx) in front of the mesh serves repeat gets without reaching the origin.
  cache:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99
      - run: tools/cache_test.sh --native

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install 1.99 --profile minimal --component clippy,rustfmt && rustup default 1.99
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly-2026-10-22 --profile minimal && rustup default nightly-2026-10-22
      - run: cargo install --locked cargo-public-api@0.52.0
      - run: tools/public_api.sh --native

  package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99
      # Package the crate, build a new project on it and run the README example, twice.
      - run: tools/package_test.sh --native

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t datumesh-mesh:ci .
      - run: docker run --rm datumesh-mesh:ci openapi > /dev/null
