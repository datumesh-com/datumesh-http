name: release

# Publishes datumesh-http to crates.io when a tag v<version> is pushed, and the datumesh-mesh
# image to ghcr.io/datumesh-com/datumesh-mesh: the test workflow must pass and the tag must
# equal the crate's version. crates.io authentication is Trusted Publishing (OIDC); the image
# is pushed with the workflow's GITHUB_TOKEN. A version already on crates.io is skipped
# rather than failing the run.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag equals the crate's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "tag $GITHUB_REF_NAME, datumesh-http $v"
          test "$tag" = "$v"

  publish:
    needs: [test, version]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99
      - name: version already published
        id: published
        run: |
          v="${GITHUB_REF_NAME#v}"
          code="$(curl -s -o /dev/null -w '%{http_code}' -A 'datumesh-http release (github.com/datumesh-com/datumesh-http)' "https://crates.io/api/v1/crates/datumesh-http/$v")"
          if [ "$code" = 200 ]; then out=true; else out=false; fi
          echo "datumesh-http $v published: $out"
          echo "datumesh_http=$out" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.published.outputs.datumesh_http != 'true'
      - run: cargo publish --locked
        if: steps.published.outputs.datumesh_http != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  image:
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        run: |
          v="${GITHUB_REF_NAME#v}"
          img=ghcr.io/datumesh-com/datumesh-mesh
          docker build -t "$img:$v" -t "$img:latest" --label "org.opencontainers.image.source=https://github.com/datumesh-com/datumesh-http" --label "org.opencontainers.image.version=$v" .
          docker push "$img:$v"
          docker push "$img:latest"
