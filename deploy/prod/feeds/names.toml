# Every name the feed jobs publish, in one table (Build 2, spec-0.6.1 S4 and S6).
# Every name is spelled with {host}. The host is a parameter with no default: common.names(host) accepts only the
# hosts of [hosts] below, spelled exactly, and nothing else in this file names a host. So production names cannot
# be produced unless the host is explicitly datumesh.com. Rehearse on mesh-test.datumesh.com first.

[hosts."mesh-test.datumesh.com"]
status = "rehearsal"

[hosts."datumesh.com"]
status = "production"

[ecb_fx]
namespace = "{host}/relay/ecb.europa.eu"
function = "fx_reference"
unit = "1"
source_name = "ecb.europa.eu"
register_source = "ecb.europa.eu"
register_code = "reference_rates"
licence = "https://www.ecb.europa.eu/services/using-our-site/disclaimer/html/index.en.html"
takeover = "https://{host}/takeover/ecb.europa.eu"
url = "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml"
history_url = "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip"
second_url = "https://data-api.ecb.europa.eu/service/data/EXR/D..EUR.SP00.A?format=csvdata&lastNObservations=1"

[estr]
namespace = "{host}/relay/ecb.europa.eu"
function = "estr"
unit = "percent"
source_name = "ecb.europa.eu"
register_source = "ecb.europa.eu"
register_code = "estr"
licence = "https://www.ecb.europa.eu/stats/financial_markets_and_interest_rates/euro_short-term_rate/html/index.en.html"
takeover = "https://{host}/takeover/ecb.europa.eu"
url = "https://data-api.ecb.europa.eu/service/data/EST/B.EU000A2X2A25.WT?format=csvdata"

[policy_rates]
namespace = "{host}/relay/ecb.europa.eu"
function = "policy_rate"
unit = "percent"
source_name = "ecb.europa.eu"
register_source = "ecb.europa.eu"
register_code = "policy_rates"
licence = "https://www.ecb.europa.eu/services/using-our-site/disclaimer/html/index.en.html"
takeover = "https://{host}/takeover/ecb.europa.eu"
# the value of the `rate` argument -> the FM dataflow series key and its file
[policy_rates.series]
mro = "MRR_FR"
dfr = "DFR"
mlfr = "MLFR"
[policy_rates.urls]
mro = "https://data-api.ecb.europa.eu/service/data/FM/B.U2.EUR.4F.KR.MRR_FR.LEV?format=csvdata"
dfr = "https://data-api.ecb.europa.eu/service/data/FM/B.U2.EUR.4F.KR.DFR.LEV?format=csvdata"
mlfr = "https://data-api.ecb.europa.eu/service/data/FM/B.U2.EUR.4F.KR.MLFR.LEV?format=csvdata"

[treasury]
namespace = "{host}/relay/treasury.gov"
function = "par_yield"
unit = "percent"
source_name = "treasury.gov"
register_source = "treasury.gov"
register_code = "par_yield_curve"
licence = "https://www.law.cornell.edu/uscode/text/17/105"
takeover = "https://{host}/takeover/treasury.gov"
# {month} is YYYYMM for the XML; {year} for the CSV
url = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value_month={month}"
second_url = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all?type=daily_treasury_yield_curve&field_tdr_date_value={year}&page&_format=csv"

[boe]
namespace = "{host}/relay/bankofengland.co.uk"
function = "bank_rate"
unit = "percent"
source_name = "bankofengland.co.uk"
register_source = "bankofengland.co.uk"
register_code = "bank_rate"
licence = "OGL-UK-3.0"
takeover = "https://{host}/takeover/bankofengland.co.uk"
# {from} and {to} are DD/Mon/YYYY (Mon in English, e.g. 02/Nov/2026) or the word now
url = "https://www.bankofengland.co.uk/boeapps/database/_iadb-fromshowcolumns.asp?csv.x=yes&Datefrom={from}&Dateto={to}&SeriesCodes=IUDBEDR&CSVF=TN&UsingCodes=Y&VPD=Y&VFD=N"

# Computed by datumesh.com from CHIRPS v3, under earth/ (no source name in the function name). The cells carry no
# `source` member (D17): a stored cell with `source` would be relayed. Lineage is in the summary and the description.
[chirps]
namespace = "{host}/earth"
function = "monthly_rainfall"
dataset = "chirps"
dataset_label = "CHIRPS v3, Climate Hazards Center, UC Santa Barbara"
unit = "mm"
source_name = "chc.ucsb.edu"
register_source = "chc.ucsb.edu"
register_code = "chirps"
licence = "https://www.chc.ucsb.edu/data/chirps3"
# {year} and {month} are 4 and 2 digits
raster_url = "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/monthly/global/tifs/chirps-v3.0.{year}.{month}.tif"
region_source = "Natural Earth 50m admin-1 states and provinces (natural-earth-vector, ne_50m_admin_1_states_provinces.geojson)"
region_source_url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_1_states_provinces.geojson"
region_source_sha256 = "69a0e06e640b2d505858ae1cb63034e4677f3000b35a98e16312932b98c426b9"
# a region: its dictionary label, its Natural Earth adm1_code, and its polygon as WKT (path from feeds/)
[chirps.regions.us_kansas]
label = "Kansas, United States"
ne_id = "USA-3530"
file = "fixtures/ne_admin1_kansas.wkt"

# The licence register (answer 3): the class register/dataset(source, code) with six stored methods.
[register]
namespace = "{host}/register"
class = "dataset"
keys = ["source", "code"]
methods = ["name", "status", "licence_page", "licence_hash", "licence_clauses", "retrieved"]
steward_process = "https://{host}/classes/change"
licence = "CC0-1.0"

class_label = "Licence register: datasets examined for relay"
class_description = "One entry per dataset the operator examined for relaying or computes from: dataset(source, code), where source is the organisation's own domain and code a short name for the dataset. Methods: name, status (relayed, computed_from or not_relayed), licence_page, licence_hash (SHA-256 of the licence page text as fetched), licence_clauses (the reuse, modification and commercial-use clauses, and for not_relayed the reason) and retrieved (when the page was fetched). A new check is a new version of the same cells; use asof for the history."
key_text = { source = "the organisation's own domain, for example ecb.europa.eu", code = "a short name for the dataset, for example reference_rates" }

# where each method's value comes from: dataset.* is the entry below, entry.* the licence check's register.json
# entry, clauses the quoted clauses (plus the reason for not_relayed). Methods not listed here return a string.
[register.value]
name = "dataset.name"
status = "dataset.status"
licence_page = "entry.licence_url"
licence_hash = "entry.sha256"
licence_clauses = "clauses"
retrieved = "entry.retrieved"
[register.returns]
retrieved = "instant"

# each method: its catalogue label and description, and the summary of its cells ({source} {code} {name} {status}
# {retrieved} {licence_page} are filled from the entry)
[register.method_text.name]
label = "Dataset name (register)"
description = "The title of the dataset, as its publisher names it."
summary = "Title of the dataset {code} from {source}: {name}."
[register.method_text.status]
label = "Relay status (register)"
description = "relayed (the operator relays the values unchanged), computed_from (the operator computes its own values from the dataset) or not_relayed (examined and not relayed; the reason is in licence_clauses)."
summary = "Status of the dataset {code} from {source} ({name}): {status}."
[register.method_text.licence_page]
label = "Licence page URL (register)"
description = "The URL of the page that states the dataset's licence or terms of use."
summary = "Licence page of the dataset {code} from {source} ({name}): {licence_page}."
[register.method_text.licence_hash]
label = "Licence page SHA-256 (register)"
description = "The SHA-256, in hex, of the licence page text as the operator fetched it. A new hash is a new version of the same cell and means the page changed."
summary = "SHA-256 of the licence page text of the dataset {code} from {source} ({name}), as fetched on {retrieved}."
[register.method_text.licence_clauses]
label = "Licence clauses (register)"
description = "The reuse, modification and commercial-use clauses of the dataset's licence, and the attribution it asks for. For not_relayed datasets it starts with the reason the dataset is not relayed."
summary = "Licence clauses of the dataset {code} from {source} ({name}), as read on {retrieved}; status {status}."
[register.method_text.retrieved]
label = "Licence page fetched (register)"
description = "The instant the operator fetched the licence page whose hash is licence_hash. As of an earlier time it answers with the earlier check."
summary = "When the licence page of the dataset {code} from {source} ({name}) was fetched: {retrieved}."

