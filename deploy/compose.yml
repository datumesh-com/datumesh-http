# The test mesh at https://mesh-test.datumesh.com: compose project datumesh-mesh-test.
#
#   docker compose -p datumesh-mesh-test -f deploy/compose.yml up -d
#
# Secrets and state live outside the repository, in $DATUMESH_DIR
# (default /root/datumesh-mesh-test, made by deploy/setup.sh):
#   secrets/db.env          POSTGRES_PASSWORD and DATABASE_URL (mode 0600, read by compose)
#   secrets/mesh.key        the signing key (uid 10001, mode 0600)
#   secrets/api-keys        the API keys' hashes (uid 10001, mode 0600)
#   catalog.json            the /find catalog (the imported vectors' names)
#   backups/                nightly pg_dump (mode 0700)
# Postgres and the mesh are on an internal network: only Caddy publishes ports (80, 443).
name: datumesh-mesh-test


services:
  postgres:
    # PostgreSQL 16.15 on Debian 13 with pgvector 0.8.6 (Build 2): the same server and glibc as the
    # postgres:16 it replaces, so the data volume is kept.
    image: pgvector/pgvector@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b  # 0.8.6-pg16-trixie
    env_file: ${DATUMESH_DIR:-/root/datumesh-mesh-test}/secrets/db.env
    environment:
      POSTGRES_DB: datumesh
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "datumesh"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    shm_size: 256m
    deploy:
      resources:
        limits: {cpus: "3", memory: 4g}

  embed:
    # The embedding model for vector `find` (Build 2 R2): HF Text Embeddings Inference CPU 1.8, pinned
    # by digest, serving the int8 ONNX of intfloat/multilingual-e5-small (MIT, 384 dimensions) from a
    # read-only mount, with no network beyond the backend. fp32, or int8 with TEI's default warm-up
    # batch, is OOM-killed at 1 GB (QUESTIONS-build2 D10).
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c  # cpu-1.8
    command: [--model-id, /model, --pooling, mean, --max-batch-tokens, "2048", --max-client-batch-size, "32", --max-concurrent-requests, "16", --port, "8080"]
    volumes:
      - ${DATUMESH_DIR:-/root/datumesh-mesh-test}/embed-model/e5-small-int8:/model:ro
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1", memory: 1g}

  mesh:
    image: ${DATUMESH_MESH_IMAGE:-ghcr.io/datumesh-com/datumesh-mesh@sha256:677ac5284702cda6f0a16d187bbb83a7380262ae79954e9f3bc924c44a34e6e9}  # datumesh-http 0.4.3, published
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${DATUMESH_DIR:-/root/datumesh-mesh-test}/secrets/db.env
    environment:
      DATUMESH_HOST: mesh-test.datumesh.com
      # The spec vectors' hosts are served as this mesh's own (it mirrors their cells); no
      # other host is fetched across meshes (an empty allowlist).
      DATUMESH_NAMESPACES: mesh-test.datumesh.com,calc.example.net,calendars.example.org,curve.example.net,data.example.org,math.example.net,rates.example.org,sheet.example.org,shop.example.net,weather.example.org
      DATUMESH_CROSS_MESH_HOSTS: ""
      DATUMESH_KEY_FILE: /run/secrets/mesh.key
      DATUMESH_API_KEYS_FILE: /run/secrets/api-keys
      DATUMESH_CATALOG_FILE: /etc/datumesh/catalog.json
      DATUMESH_TRUST_PROXY: "1"
      DATUMESH_LISTEN: 0.0.0.0:8080
      DATUMESH_POOL_SIZE: "32"
      DATUMESH_BUDGET_MS: "1000"
      DATUMESH_RATE_PER_IP: "60"
      DATUMESH_RATE_IP_BURST: "120"
      DATUMESH_RATE_PER_KEY: "600"
      DATUMESH_RATE_VERIFY_PER_IP: "60"
      DATUMESH_LICENCE: CC-BY-4.0
      DATUMESH_MIGRATE: "1"
      # Build 2, mesh-test only: vector find through the embed service, each function test as a
      # cell, and POST /bundles open to any host with a valid key document (D11).
      DATUMESH_EMBED_URL: http://embed:8080
      DATUMESH_TEST_CELLS: "1"
      DATUMESH_PUBLISH_DOMAINS: "*"
      RUST_LOG: info
    volumes:
      - ${DATUMESH_DIR:-/root/datumesh-mesh-test}/secrets:/run/secrets:ro
      - ${DATUMESH_DIR:-/root/datumesh-mesh-test}/catalog.json:/etc/datumesh/catalog.json:ro
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "4", memory: 4g}

  caddy:
    # caddy:2.10.2-alpine, pinned by digest.
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on: [mesh]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m}

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
